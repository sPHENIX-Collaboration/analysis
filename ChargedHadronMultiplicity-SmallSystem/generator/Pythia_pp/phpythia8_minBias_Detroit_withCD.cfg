! sPHENIX HF TG MD2 Pythia8 Tune  --  p+p 200 GeV, inelastic INCLUDING central diffraction
! See discussions at https://indico.bnl.gov/event/10309/

! Beam settings
Beams:idA = 2212   ! first beam, p = 2212, pbar = -2212
Beams:idB = 2212   ! second beam, p = 2212, pbar = -2212
Beams:eCM = 200.   ! CM energy of collision

! Settings related to output in init(), next() and stat()
Init:showChangedSettings = on
Init:showAllSettings = off
Next:numberCount = 100000          ! print message every n events
Next:numberShowInfo = 0            ! print event information n times
#Next:numberShowProcess = 1        ! print process record n times
Next:numberShowEvent = 0           ! print event record n times

! PDF  (Detroit tune: NNPDF3.1 QCD LO, alpha_s(M_Z) = 0.130 -> pSet 17 in 8.3xx)
PDF:pSet = 17
MultipartonInteractions:bProfile = 2
MultipartonInteractions:ecmRef = 200
MultipartonInteractions:pT0Ref = 1.40
MultipartonInteractions:ecmPow = 0.135
MultipartonInteractions:coreRadius = 0.56
MultipartonInteractions:coreFraction = 0.78
ColourReconnection:range = 5.4     ! NOTE: only used by ColourReconnection:mode = 0

! Process
SoftQCD:inelastic = on             ! codes 101, 103, 104, 105, 106

! Central diffraction (code 106, p p -> p X p, double-Pomeron exchange).
! SoftQCD:inelastic already *enables* code 106, but every PYTHIA tune -- including
! the default -- forces sigma_CD = 0 via SigmaTotal:zeroAXB = on, so no code-106
! event is ever produced unless this flag is switched off.  It must appear AFTER
! any Tune:pp / Tune:ee selection.  Turning it on leaves sigma_tot unchanged and
! takes the CD cross section out of the non-diffractive one
! (sigma_ND = sigma_tot - sigma_el - sigma_XB - sigma_AX - sigma_XX - sigma_AXB),
! so the ND phenomenology shifts by ~sigma_CD/sigma_ND, i.e. a couple of percent.
SigmaTotal:zeroAXB = off

! K factor for inelastic processes
MultipartonInteractions:Kfactor = 1.0

! Cuts
#PhaseSpace:pTHatMin = 10.0
! NOTE: xyMax / zMax below are only read when limitCylinder = on, so as written
! these three lines are a no-op and every unstable particle (K0S, Lambda, ...)
! decays. 
ParticleDecays:limitCylinder = off
ParticleDecays:xyMax = 0.000001
ParticleDecays:zMax = 0.000001

ColourReconnection:mode = 2        ! gluon-move model
TimeShower:alphaSvalue = 0.18

! Main:numberOfEvents = 200000
