# NNScaleMap skim card:  python skim.py --config configs/skim_V0_polyseeding_ana573.toml
# One input only (e.g. one Condor job per file):  ... --file <path of one input below>
# Output: <skim_dir>/<production>/<tag>/{Kshort,Lambda0}/skim_run<N>.root + read-only skim_run<N>.toml,
# with <tag> = ptmax<threshold>_bulk<fraction>_seed<seed>_<stage1 | stage1stage2>, e.g. ptmax1p0_bulk0p02_seed42_stage1

[input]
production = "V0_polyseeding_ana573"    # names the output subfolder
# glob patterns are expanded and sorted; files that cannot be read are reported and skipped
kshort = ["/sphenix/user/cdean/public/V0_polyseeding_ana573/output_Kshort_reco_KFParticle_run*.root"]
lam = ["/sphenix/user/cdean/public/V0_polyseeding_ana573/output_Lambda0_reco_KFParticle_run*.root"]
tree = "DecayTree"

[selection]
ptmax_threshold = 1.0       # GeV; every candidate with max(daughter pT) above this is kept
bulk_fraction = 0.02        # random fraction kept below the threshold
seed = 42                   # combined with each input file name, so every file has its own reproducible draw

[branches]
keep_stage2 = false         # true also writes the [branches.stage2] lists (needed for stage 2, --reso_model pull)

[branches.stage1]
kshort = [
  "K_S0_mass", "K_S0_pT", "K_S0_pseudorapidity", "K_S0_phi",
  "track_1_pT", "track_1_pseudorapidity", "track_1_phi", "track_1_charge", "track_1_PDG_ID",
  "track_2_pT", "track_2_pseudorapidity", "track_2_phi", "track_2_charge", "track_2_PDG_ID",
]
lam = [
  "Lambda0_mass", "Lambda0_pT", "Lambda0_pseudorapidity", "Lambda0_phi",
  "track_1_pT", "track_1_pseudorapidity", "track_1_phi", "track_1_charge", "track_1_PDG_ID",
  "track_2_pT", "track_2_pseudorapidity", "track_2_phi", "track_2_charge", "track_2_PDG_ID",
]

[branches.stage2]
kshort = ["track_1_pTErr", "track_1_Covariance", "track_2_pTErr", "track_2_Covariance"]
lam = ["track_1_pTErr", "track_1_Covariance", "track_2_pTErr", "track_2_Covariance"]

[output]
skim_dir = "/sphenix/tg/tg01/hf/hjheng/HF-analysis/NNScaleMap/KFParticle_skims"
